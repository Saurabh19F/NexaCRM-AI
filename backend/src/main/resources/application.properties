# ─────────────────────────────────────────────
# NexaCRM AI — Spring Boot Application Config
# ─────────────────────────────────────────────

spring.application.name=nexacrm-ai
# Load local .env values when running from backend/ or project root.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ── Server ──────────────────────────────────
server.port=8080
server.servlet.context-path=/

# ── Database (PostgreSQL) ───────────────────
# DB_URL takes priority; falls back to building from DB_HOST/DB_PORT/DB_NAME (Render injects these).
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nexacrm}}
spring.datasource.username=${DB_USERNAME:nexacrm}
spring.datasource.password=${DB_PASSWORD:nexacrm123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ─────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ── Flyway ───────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── JWT ──────────────────────────────────────
jwt.secret=${JWT_SECRET:nexacrm-very-secret-key-change-in-production-2026}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ── CORS ─────────────────────────────────────
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
cors.allowed-headers=*
cors.max-age=3600

# ── OpenAI ───────────────────────────────────
openai.api.key=${OPENAI_API_KEY:your-openai-key-here}
openai.model=gpt-4-turbo-preview
openai.max-tokens=1500

# ── Email (SMTP) ──────────────────────────────
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:your-email@gmail.com}
spring.mail.password=${SMTP_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── AWS S3 ────────────────────────────────────
aws.s3.access-key=${AWS_ACCESS_KEY:your-access-key}
aws.s3.secret-key=${AWS_SECRET_KEY:your-secret-key}
aws.s3.bucket=${AWS_BUCKET:nexacrm-files}
aws.s3.region=${AWS_REGION:ap-south-1}

# ── Cloudinary ────────────────────────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your-cloud-name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your-api-key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your-api-secret}

# ── Meta (Facebook/Instagram) ─────────────────
meta.app-id=${META_APP_ID:your-meta-app-id}
meta.app-secret=${META_APP_SECRET:your-meta-app-secret}
meta.webhook-token=${META_WEBHOOK_TOKEN:your-webhook-verify-token}
meta.page-access-token=${META_PAGE_ACCESS_TOKEN:your-page-access-token}
meta.graph-api-version=v19.0

# ── WhatsApp Business Cloud API ───────────────
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:your-phone-number-id}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:your-access-token}
whatsapp.api-version=v19.0
nexacrm.whatsapp.aiadrika-base-url=${AIADRIKA_BASE_URL:https://aiadrika.in/api/send}
nexacrm.whatsapp.aiadrika.instance-id=${AIADRIKA_INSTANCE_ID:695A0632072F9}
nexacrm.whatsapp.aiadrika.access-token=${AIADRIKA_ACCESS_TOKEN:6878f244d0e8a}

# ── Actuator ──────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ── Logging ───────────────────────────────────
logging.level.com.nexacrm=DEBUG
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n

# ── File Upload ───────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ── Multi-tenant ──────────────────────────────
nexacrm.multi-tenant.enabled=true
nexacrm.default-tenant=default
